spring:
  application:
    name: identity-service
  profiles:
    default: local
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/smartpayut_identity}
    username: ${IDENTITY_DB_USER:smartpayut_identity}
    password: ${IDENTITY_DB_PASSWORD:identity_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:smartpayut}
    password: ${RABBITMQ_PASSWORD:smartpayut_dev_password}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:3s}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8181/realms/smartpayut/protocol/openid-connect/certs}
server:
  port: ${IDENTITY_SERVICE_PORT:9910}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8181}
  realm: ${KEYCLOAK_REALM:smartpayut}
  client-id: ${KEYCLOAK_CLIENT_ID:smartpayut-identity}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:smartpayut-identity-admin}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
