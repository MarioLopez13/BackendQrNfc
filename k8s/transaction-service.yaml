---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartpayut-transaction
  namespace: smartpayut-dev
  labels:
    app: smartpayut-transaction
spec:
  replicas: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: smartpayut-transaction
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: "50%"
      maxUnavailable: "50%"
  template:
    metadata:
      labels:
        app: smartpayut-transaction
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-db
          image: busybox
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - >-
              echo Waiting 10s...; sleep 10;
              until nc -z zeus-rw.postgres-prod.svc.cluster.local 5432;
              do echo waiting postgres...; sleep 2; done;
              echo DB ready
      containers:
        - name: smartpayut-transaction
          image: ghcr.io/mariolopez13/smartpayut-transaction-service-dev:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9913
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SERVER_PORT
              value: "9913"
            # ── Database ──
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://zeus-rw.postgres-prod.svc.cluster.local:5432/smartpayut-dev?currentSchema=transaction
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smartpayut-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartpayut-db-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_READ_DATASOURCE_URL
              value: jdbc:postgresql://zeus-rw.postgres-prod.svc.cluster.local:5432/smartpayut-dev?currentSchema=transaction
            - name: SPRING_READ_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smartpayut-db-secret
                  key: POSTGRES_USER
            - name: SPRING_READ_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartpayut-db-secret
                  key: POSTGRES_PASSWORD
            # ── Redis ──
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: smartpayut-db-secret
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartpayut-db-secret
                  key: REDIS_PASSWORD
            - name: REDIS_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: smartpayut-db-secret
                  key: REDIS_HOST
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartpayut-db-secret
                  key: REDIS_PASSWORD
            # ── RabbitMQ ──
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: smartpayut-db-secret
                  key: RABBITMQ_HOST
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smartpayut-db-secret
                  key: RABBITMQ_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartpayut-db-secret
                  key: RABBITMQ_PASSWORD
            # ── JWT / Keycloak ──
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: https://sso-dev.kynsoft.work/realms/smartpayut
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: https://sso-dev.kynsoft.work/realms/smartpayut/protocol/openid-connect/certs
            # ── HikariCP ──
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "2"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 9913
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 1
          readinessProbe:
            tcpSocket:
              port: 9913
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
            timeoutSeconds: 1
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: smartpayut-transaction
  namespace: smartpayut-dev
spec:
  selector:
    app: smartpayut-transaction
  ports:
    - name: http
      port: 9913
      targetPort: 9913
      protocol: TCP
  type: ClusterIP
