spring:
  application:
    name: payment-service
  profiles:
    default: local
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/smartpayut_payment}
    username: ${PAYMENT_DB_USER:smartpayut_payment}
    password: ${PAYMENT_DB_PASSWORD:payment_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:smartpayut}
    password: ${RABBITMQ_PASSWORD:smartpayut_dev_password}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/smartpayut/protocol/openid-connect/certs}

server:
  port: ${PAYMENT_SERVICE_PORT:9912}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

services:
  wallet:
    base-url: ${WALLET_SERVICE_URL:http://localhost:9911}
    service-token: ${WALLET_SERVICE_TOKEN:}
  keycloak:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/smartpayut/protocol/openid-connect/token}
    client-id: ${PAYMENT_KEYCLOAK_CLIENT_ID:smartpayut-payment}
    client-secret: ${PAYMENT_KEYCLOAK_CLIENT_SECRET:}

payment:
  rabbitmq:
    exchange: ${PAYMENT_EVENTS_EXCHANGE:smartpayut.payment.events}
  outbox:
    fixed-delay-ms: ${PAYMENT_OUTBOX_FIXED_DELAY_MS:1000}
    batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE:20}
    confirm-timeout-seconds: ${PAYMENT_OUTBOX_CONFIRM_TIMEOUT_SECONDS:5}
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:false}
  placetopay:
    base-url: ${PLACETOPAY_BASE_URL:https://checkout-test.placetopay.ec}
    login: ${PLACETOPAY_LOGIN:}
    secret-key: ${PLACETOPAY_SECRET_KEY:}
    default-expiration-minutes: ${PLACETOPAY_EXPIRATION_MINUTES:30}
    simulation-enabled: false
    simulation-process-url-base: ${PLACETOPAY_SIMULATION_PROCESS_URL_BASE:http://localhost:5174/#/top-up/simulated}
