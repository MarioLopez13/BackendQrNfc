spring:
  datasource:
    url: jdbc:h2:mem:payment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway.enabled: false
  jpa.hibernate.ddl-auto: none
  autoconfigure.exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  security.oauth2.resourceserver.jwt.jwk-set-uri: http://localhost:8180/realms/smartpayut/protocol/openid-connect/certs

payment:
  outbox:
    enabled: false
