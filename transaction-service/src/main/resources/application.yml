spring:
  application:
    name: transaction-service
  profiles:
    default: local
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:postgresql://localhost:5432/smartpayut_transaction}
    username: ${TRANSACTION_DB_USER:smartpayut_transaction}
    password: ${TRANSACTION_DB_PASSWORD:transaction_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:smartpayut}
    password: ${RABBITMQ_PASSWORD:smartpayut_dev_password}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/smartpayut/protocol/openid-connect/certs}

server:
  port: ${TRANSACTION_SERVICE_PORT:9913}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

transaction:
  rabbitmq:
    wallet-exchange: ${WALLET_EVENTS_EXCHANGE:smartpayut.wallet.events}
    payment-exchange: ${PAYMENT_EVENTS_EXCHANGE:smartpayut.payment.events}
    queue: ${TRANSACTION_EVENTS_QUEUE:smartpayut.transaction.events}
    dead-letter-exchange: ${TRANSACTION_DLX:smartpayut.transaction.dlx}
    dead-letter-queue: ${TRANSACTION_DLQ:smartpayut.transaction.events.dlq}
